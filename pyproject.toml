[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jmcomic-calibre"
version = "0.1.0"
description = "JMComic → Calibre 一键入库：下载、转 PDF/CBZ、写元数据、导入书库"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "yifenliwu" }]
keywords = ["jmcomic", "calibre", "comic", "manga", "ebook", "downloader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["jmcomic>=2.7.0,<3.0.0"]

[project.optional-dependencies]
pdf = ["img2pdf"]
dev = ["ruff", "pytest"]

[project.scripts]
jmcal = "jmcomic_calibre.cli:main"

[project.urls]
Homepage = "https://github.com/yifenliwu/jmcomic-calibre"
Issues = "https://github.com/yifenliwu/jmcomic-calibre/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jmcomic_calibre"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
